name: Cleanup Stale Workflow Runs

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.repository == 'backstage/backstage' # prevent running on forks
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.0
        with:
          egress-policy: audit

      - name: Delete Cancelled and Skipped Workflow Runs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Delete workflow runs older than 90 days with cancelled or skipped status
            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - 90);
            
            let deletedCount = 0;
            let totalChecked = 0;
            
            try {
              const { data: workflows } = await github.rest.actions.listRepoWorkflows({
                owner,
                repo,
              });
              
              for (const workflow of workflows.workflows) {
                let page = 1;
                let hasMore = true;
                
                while (hasMore) {
                  const { data: runs } = await github.rest.actions.listWorkflowRuns({
                    owner,
                    repo,
                    workflow_id: workflow.id,
                    per_page: 100,
                    page: page,
                  });
                  
                  if (runs.workflow_runs.length === 0) {
                    hasMore = false;
                    break;
                  }
                  
                  for (const run of runs.workflow_runs) {
                    totalChecked++;
                    const runDate = new Date(run.created_at);
                    
                    // Delete runs that are:
                    // 1. Older than 90 days AND (cancelled OR skipped)
                    // 2. OR older than 180 days regardless of status (to save storage)
                    const veryOld = new Date();
                    veryOld.setDate(veryOld.getDate() - 180);
                    
                    if (
                      (runDate < cutoffDate && (run.status === 'cancelled' || run.conclusion === 'skipped')) ||
                      (runDate < veryOld)
                    ) {
                      try {
                        await github.rest.actions.deleteWorkflowRun({
                          owner,
                          repo,
                          run_id: run.id,
                        });
                        deletedCount++;
                        console.log(`Deleted workflow run ${run.id} from ${run.created_at}`);
                      } catch (error) {
                        console.log(`Failed to delete run ${run.id}: ${error.message}`);
                      }
                    }
                  }
                  
                  page++;
                  // Limit to 5 pages per workflow to avoid rate limits
                  if (page > 5) {
                    hasMore = false;
                  }
                }
              }
              
              console.log(`Cleanup complete: Deleted ${deletedCount} out of ${totalChecked} workflow runs checked`);
              
              await core.summary
                .addHeading('Workflow Cleanup Summary')
                .addRaw(`- Total runs checked: ${totalChecked}\n`)
                .addRaw(`- Runs deleted: ${deletedCount}\n`)
                .write();
                
            } catch (error) {
              core.setFailed(`Cleanup failed: ${error.message}`);
            }
