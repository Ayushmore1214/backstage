name: Workflow Performance Monitor

on:
  workflow_run:
    workflows: ['CI', 'Deploy Packages', 'E2E Linux', 'E2E Windows']
    types:
      - completed
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  actions: read
  contents: read

jobs:
  analyze-performance:
    runs-on: ubuntu-latest
    if: github.repository == 'backstage/backstage' # prevent running on forks
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Analyze Workflow Performance
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            // Get workflow runs for the past 7 days
            const since = new Date();
            since.setDate(since.getDate() - 7);
            
            const workflows = ['CI', 'Deploy Packages', 'E2E Linux', 'E2E Windows'];
            const stats = {};
            
            for (const workflowName of workflows) {
              try {
                const { data: workflowData } = await github.rest.actions.listRepoWorkflows({
                  owner,
                  repo,
                });
                
                const workflow = workflowData.workflows.find(w => w.name === workflowName);
                if (!workflow) continue;
                
                const { data: runs } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: workflow.id,
                  per_page: 100,
                  created: `>=${since.toISOString()}`,
                });
                
                const durations = runs.workflow_runs
                  .filter(run => run.status === 'completed')
                  .map(run => {
                    const start = new Date(run.created_at);
                    const end = new Date(run.updated_at);
                    return (end - start) / 1000 / 60; // minutes
                  });
                
                if (durations.length > 0) {
                  const avg = durations.reduce((a, b) => a + b, 0) / durations.length;
                  const max = Math.max(...durations);
                  const min = Math.min(...durations);
                  
                  stats[workflowName] = {
                    count: durations.length,
                    average: avg.toFixed(2),
                    max: max.toFixed(2),
                    min: min.toFixed(2),
                  };
                }
              } catch (error) {
                console.log(`Error processing workflow ${workflowName}: ${error.message}`);
              }
            }
            
            // Generate summary
            let summary = '## Workflow Performance Summary (Last 7 Days)\n\n';
            summary += '| Workflow | Runs | Avg Duration | Min | Max |\n';
            summary += '|----------|------|--------------|-----|-----|\n';
            
            for (const [name, data] of Object.entries(stats)) {
              summary += `| ${name} | ${data.count} | ${data.average}m | ${data.min}m | ${data.max}m |\n`;
            }
            
            console.log(summary);
            
            // Add to job summary
            await core.summary
              .addHeading('Workflow Performance Report')
              .addRaw(summary)
              .write();
