name: Action Version Check

on:
  schedule:
    # Run weekly on Wednesday at 09:00 UTC
    - cron: '0 9 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-actions:
    runs-on: ubuntu-latest
    if: github.repository == 'backstage/backstage' # prevent running on forks
    
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.0
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Action Versions
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const yaml = require('js-yaml');
            
            const workflowsDir = '.github/workflows';
            const files = fs.readdirSync(workflowsDir).filter(f => f.endsWith('.yml') || f.endsWith('.yaml'));
            
            const actionUsage = new Map();
            
            // Collect all action usages
            for (const file of files) {
              const filePath = path.join(workflowsDir, file);
              const content = fs.readFileSync(filePath, 'utf8');
              
              try {
                const workflow = yaml.load(content);
                
                const collectActions = (steps) => {
                  if (!steps) return;
                  for (const step of steps) {
                    if (step.uses) {
                      const match = step.uses.match(/^([^@]+)@(.+)$/);
                      if (match) {
                        const [, action, ref] = match;
                        if (!actionUsage.has(action)) {
                          actionUsage.set(action, new Set());
                        }
                        actionUsage.get(action).add({
                          ref,
                          file,
                          isSHA: ref.length === 40 && /^[a-f0-9]+$/.test(ref),
                        });
                      }
                    }
                  }
                };
                
                if (workflow.jobs) {
                  for (const [jobName, job] of Object.entries(workflow.jobs)) {
                    collectActions(job.steps);
                  }
                }
              } catch (error) {
                console.log(`Error parsing ${file}: ${error.message}`);
              }
            }
            
            // Generate report
            let report = '# Action Version Report\n\n';
            report += 'This report shows all GitHub Actions used in workflows and their versions.\n\n';
            
            report += '## Summary\n\n';
            report += `- Total unique actions: ${actionUsage.size}\n`;
            
            let pinnedCount = 0;
            let unpinnedCount = 0;
            
            for (const [action, refs] of actionUsage.entries()) {
              const allRefs = Array.from(refs);
              if (allRefs.every(r => r.isSHA)) {
                pinnedCount++;
              } else {
                unpinnedCount++;
              }
            }
            
            report += `- Actions pinned to SHA: ${pinnedCount}\n`;
            report += `- Actions not pinned: ${unpinnedCount}\n\n`;
            
            if (unpinnedCount > 0) {
              report += '## ⚠️ Actions Not Pinned to SHA\n\n';
              report += 'These actions should be pinned to a specific SHA for security:\n\n';
              
              for (const [action, refs] of actionUsage.entries()) {
                const allRefs = Array.from(refs);
                if (!allRefs.every(r => r.isSHA)) {
                  report += `### ${action}\n\n`;
                  for (const ref of allRefs) {
                    if (!ref.isSHA) {
                      report += `- \`${ref.ref}\` in ${ref.file}\n`;
                    }
                  }
                  report += '\n';
                }
              }
            }
            
            report += '## Action Inventory\n\n';
            report += '| Action | Versions Used | Files |\n';
            report += '|--------|---------------|-------|\n';
            
            for (const [action, refs] of Array.from(actionUsage.entries()).sort()) {
              const allRefs = Array.from(refs);
              const versions = [...new Set(allRefs.map(r => r.ref))].join(', ');
              const fileList = [...new Set(allRefs.map(r => r.file))];
              report += `| ${action} | ${versions.substring(0, 50)}${versions.length > 50 ? '...' : ''} | ${fileList.length} files |\n`;
            }
            
            console.log(report);
            
            await core.summary
              .addRaw(report)
              .write();
            
            // If there are unpinned actions, create a notice
            if (unpinnedCount > 0) {
              core.warning(`Found ${unpinnedCount} action(s) that are not pinned to SHA. See job summary for details.`);
            }
